name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      # actions/jekyll-build-pages is a container action running as root, so it
      # leaves _site owned by root. Every later step runs as `runner` and cannot
      # write into it, which fails the card render with EACCES.
      - name: Take ownership of the build output
        run: sudo chown -R "$(id -u):$(id -g)" _site
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache rendered cards
        id: cards
        uses: actions/cache@v4
        with:
          path: .card-cache
          key: cards-${{ hashFiles('_predictions/**', '_posts/**', 'predictions/**', '_config.yml', 'research/render_cards.mjs', 'research/card_data.mjs', 'research/card_templates.mjs', 'assets/fonts/**', 'research/package.json', 'research/package-lock.json') }}
      - name: Restore cached cards
        if: steps.cards.outputs.cache-hit == 'true'
        run: cp -R .card-cache/. _site/
      - name: Test the card modules
        run: make test
      - name: Render social cards
        if: steps.cards.outputs.cache-hit != 'true'
        run: |
          cd research && npm install && npx playwright install --with-deps chromium
          cd .. && node research/render_cards.mjs
          mkdir -p .card-cache
          cd _site && find . \( -name card.png -o -path './assets/img/og/*.png' \) \
            -exec cp --parents {} ../.card-cache/ \;
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
