# Site settings
title: Greg Osuri
email: me@gregosuri.com
description: > # this means to ignore newlines until "baseurl:"
  I build things for people that build things
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://www.gregosuri.com" # the base hostname & protocol for your site (must match CNAME)
twitter_username: GregOsuri
github_username:  gosuri

# Build settings
markdown: kramdown

permalink: pretty

plugins:
  - jekyll-sitemap

paginate: 5

# Kept out of the published site: the design system previews, planning docs and
# build tooling live in the repo but are not pages.
exclude:
  - design
  - docs
  - README.md
  - Makefile
  - Dockerfile
  - deploy.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - research
  - videos
  - catalog
  - transcripts
  - PREDICTIONS.md
  - CATALOG.md
  - AGENTS.md
  - CLAUDE.md

collections:
  predictions:
    output: true

# Local-only. GitHub Pages builds with Ruby Sass 3.7.4 (jekyll-sass-converter
# 1.5.2), which has no @use/@forward and ignores this block in safe mode. The
# Gemfile's Jekyll 4 uses Dart Sass, which warns that @import is deprecated —
# noise we cannot act on without breaking the real builder.
sass:
  silence_deprecations:
    - import

karmadown:
  enable_coreray: true
