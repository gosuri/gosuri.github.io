---
layout: default
title: Writing
nav: true
---
<h1 class="page-title">{{ page.title }}</h1>
<p class="standfirst">Essays since 2009, including pieces originally published elsewhere.</p>
<ul class="post-list">
  {%- for post in site.posts %}
  <li><time datetime="{{ post.date | date: "%Y-%m-%d" }}">{{ post.date | date: "%b %Y" }}</time> <a class="post-link" href="{{ post.url | prepend: site.baseurl }}">{{ post.title | escape }}</a></li>
  {%- endfor %}
</ul>
<p class="section-more"><a href="{{ "/feed.xml" | prepend: site.baseurl }}">Subscribe via RSS →</a></p>
